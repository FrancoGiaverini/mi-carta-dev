<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Franco el CodeMaster Legendario</title>
    <link rel="stylesheet" href="estilos.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  </head>
  <body>
    <div class="carta legendaria">
      <header>
        <h1>⚔️ CodeMaster</h1>
        <h2>Frontend Developer</h2>
      </header>
      <div class="avatar">
        <img
          src="https://api.dicebear.com/7.x/adventurer-neutral/svg?seed=franco"
          alt="Mi avatar"
        />
      </div>
      <section class="estadisticas">
        <h3>📊 Estadísticas</h3>
        <p>HTML - 90</p>
        <div class="barra">
          <div class="progreso" style="width: 90%"></div>
        </div>
        <p>CSS - 85</p>
        <div class="barra">
          <div class="progreso" style="width: 85%"></div>
        </div>
        <p>JavaScript - 75</p>
        <div class="barra">
          <div class="progreso" style="width: 75%"></div>
        </div>
        <p>Ingles - 70</p>
        <div class="barra">
          <div class="progreso" style="width: 75%"></div>
        </div>
      </section>
      <section class="habilidad">
        <h3>✨ Habilidad Especial</h3>
        <h4>Aura responsiva</h4>
        <p>Convierte todo en 30 metros a su alrededor en responsive</p>
      </section>
      <section>
        <h3>🏆 Rareza</h3>
        <p class="rareza">Legendaria</p>
      </section>
      <button id="btn-activar">Activar habilidad</button>
      <p id="contador">Activada 0 veces</p>
      <h3>🎮 Hobbies fuera del código</h3>
      <div id="hobby">
        <h4 id="hobby-nombre"></h4>
        <p id="hobby-descripcion"></p>
      </div>
      <p id="horas-hobby"></p>
      <button id="btn-hobby">Otro hobby</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
